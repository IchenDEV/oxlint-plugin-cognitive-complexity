name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test

      - name: Verify plugin accepts valid fixture
        run: pnpm run lint:fixture

      - name: Verify plugin rejects invalid fixture
        run: |
          set +e
          pnpm run lint:fixture:invalid
          status=$?
          set -e
          test "$status" -eq 1

      - name: Verify npm package contents
        run: npm pack --dry-run
